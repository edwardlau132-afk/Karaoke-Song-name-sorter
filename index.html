<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Karaoke Song List</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .field-row {
            display: flex;
            gap: 2px;
            flex-wrap: nowrap;
            align-items: center;
            margin-bottom: 10px;
            overflow-x: visible;
        }

        .field-row label {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            font-size: 14px;
            gap: 3px;
        }

        .field-row input[type="search"] {
            padding: 6px 8px;
            min-width: 120px;
            font-size: 14px;
            height: 32px;
        }

        .controls {
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            table-layout: fixed;
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #eee;
            text-align: left;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        th {
            background: #fafafa;
        }

        /* Fixed proportions so columns don't resize based on which rows
           happen to be visible (e.g. before vs. during a search). */
        th:nth-child(1), td:nth-child(1) { width: 9%; }   /* Number */
        th:nth-child(2), td:nth-child(2) { width: 24%; }  /* Song Title */
        th:nth-child(3), td:nth-child(3) { width: 24%; }  /* Singer */
        th:nth-child(4), td:nth-child(4) { width: 17%; }  /* PinYin */
        th:nth-child(5), td:nth-child(5) { width: 17%; }  /* Cantonese */
        th:nth-child(6), td:nth-child(6) { width: 9%; }   /* Word Number */
    </style>
</head>

<body>
    <main style="max-width:1100px; margin:20px auto; font-family:Arial,Segoe UI,Roboto;">
        <h1>Karaoke Song Search 卡拉OK歌曲搜索</h1>

        <section aria-label="Field searches">
            <div class="field-row">
                <label>Number 編號<input id="search-Number_編號" type="search" placeholder="Search Number_編號" /></label>
                <label>Song Title 歌名<input id="search-Song_Title_歌名" type="search"
                        placeholder="Search Song_Title_歌名" /></label>
                <label>Singer 歌手<input id="search-Singer_歌手" type="search" placeholder="Search Singer_歌手" /></label>
                <label>PinYin 国語拼音<input id="search-PinYin_国語拼音" type="search" placeholder="Search PinYin_国語拼音 / PinYin_国語拼" /></label>
                <label>Cantonese 粤語拼音<input id="search-Cantonese_粤語拼音" type="search" placeholder="Search Cantonese_粤語拼音" /></label>
                <label>Song Word Number 字數統計<input id="search-Word_Number_字數統計" type="search" placeholder="Search Word_Number_字數統計" /></label>
                <button id="clear-filters" style="height:32px;">Clear</button>
            </div>
        </section>

        <table id="results-table" aria-live="polite">
            <thead>
                <tr>
                    <th>Number_編號</th>
                    <th>Song_Title_歌名</th>
                    <th>Singer_歌手</th>
                    <th>PinYin_国語拼音</th>
                    <th>Cantonese_粤語拼音</th>
                    <th>Word_Number_字數統計</th>
                </tr>
            </thead>
 <tbody id="results-body">
    <tr>
        <td colspan="6" style="color:#666">Loading...</td>
    </tr>
</tbody>
        </table>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="script.js?v=9"></script>
</body>

</html>
