<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Excel Searcher — field-specific searches</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .field-row {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 10px;
            overflow-x: visible;
        }

        .field-row label {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            font-size: 14px;
            gap: 3px;
        }

        .field-row input[type="search"] {
            padding: 6px 8px;
            min-width: 120px;
            font-size: 14px;
            height: 32px;
        }

        .controls {
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #fafafa;
        }
    </style>
</head>

<body>
    <main style="max-width:1100px; margin:20px auto; font-family:Arial,Segoe UI,Roboto;">
        <h1>Excel Searcher — field-specific searches</h1>

        <div class="controls">
            <label>
                Upload .xls/.xlsx/.csv:
                <input id="file-input" type="file" accept=".xls,.xlsx,.csv" />
            </label>

            <div id="upload-info" style="margin-left:12px; color:#666;">No file uploaded.</div>
        </div>

        <section aria-label="Field searches">
            <div id="search-fields" class="field-row">
                <!-- Search fields will be dynamically generated here -->
            </div>
        </section>

        <div id="info" style="color:#666; margin-bottom:8px;">No file uploaded.</div>

        <table id="results-table" aria-live="polite">
            <thead id="table-head">
                <tr>
                    <td colspan="6" style="color:#666">No file uploaded.</td>
                </tr>
            </thead>
            <tbody id="results-body">
            </tbody>
        </table>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
